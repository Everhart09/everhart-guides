# Builds the macOS version on GitHub's Mac runners and attaches it to the release.
# Runs automatically when a release is published, or by hand (Actions → Mac release → Run workflow) for an existing tag.
name: Mac release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v1.1.7)
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no Apple Developer ID: ad-hoc sign only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build macOS app (universal: Apple Silicon + Intel)
        run: npm run dist:mac

      - name: Attach to the release
        run: |
          ls -la release
          gh release upload "$TAG" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --clobber
